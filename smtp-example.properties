# Example SMTP configuration; copy settings into application-local.properties or deployment secrets.
# Do not commit real passwords. Requires a verified sender at your mail provider.
account.mail.mode=smtp
account.mail.base-url=https://YOUR-APP-DOMAIN
account.mail.from=no-reply@YOUR-VERIFIED-DOMAIN
spring.mail.host=${SMTP_HOST}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME}
spring.mail.password=${SMTP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.checkserveridentity=true
