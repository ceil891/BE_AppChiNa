# Isolated from public application tables, including migrations and test accounts.
spring.config.import=optional:file:./application-local.properties,optional:file:./ai-local.properties
spring.datasource.username=${TEST_DB_USERNAME:postgres}
spring.flyway.enabled=true
spring.flyway.schemas=chinann_test
spring.flyway.default-schema=chinann_test
spring.datasource.hikari.schema=chinann_test
# Shared loopback in integration suites; dedicated throttle tests override these with small limits.
auth.limits.global-per-minute=10000
auth.limits.login-ip-per-minute=10000
auth.limits.register-ip-per-hour=10000
